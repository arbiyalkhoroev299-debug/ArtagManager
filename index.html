<style>

</style></head><body>
<header><span class=lg>ARTAG</span><small id="wn"></small></header><main id="main"></main><div id="mod"></div>
<nav id="nav"></nav>
<script>
const S=['products','logs','tasks','orders','issues','staff','shifts','settings'];let db;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fT=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),fD=t=>new Date(t).toLocaleDateString('ru'),fDT=t=>fD(t)+' '+fT(t);
const dur=ms=>{const m=Math.round(Math.max(0,ms)/6e4);return Math.floor(m/60)+' ч '+m%60+' мин'};
const day=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const iso=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('artag',1);q.onupgradeneeded=()=>S.forEach(s=>q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>{db=q.result;r()};q.onerror=j});
const tx=(s,m,f)=>new Promise((r,j)=>{const t=db.transaction(s,m);const o=f(t.objectStore(s));t.oncomplete=()=>r(o&&o.result);t.onerror=()=>j(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id)),clr=s=>tx(s,'readwrite',o=>o.clear());
const PR=['Низкий','Средний','Высокий'],TS=['Новая','В работе','Ожидает','Выполнена','Отменена'],OS=['Новый','На подготовке','Готов','Выдан','Отменён'],IS=['Новая','Проверяется','Решена','Закрыта'],IC=['Недостача','Повреждение товара','Ошибка размещения','Несоответствие остатков','Оборудование','Организация работы','Прочее'];
const E={products:{t:'Товар',f:[['name','Название *'],['sku','Артикул'],['cat','Категория'],['size','Размер'],['boxes','Коробок','n'],['perBox','Единиц в коробке','n'],['sqm','м² в одной коробке','n'],['unit','Ед. измерения'],['loc','Место (зона/ряд/ячейка)'],['desc','Описание']]},
tasks:{t:'Задача',f:[['title','Название *'],['desc','Описание'],['due','Срок','d'],['prio','Приоритет','s',PR],['status','Статус','s',TS],['who','Ответственный'],['note','Примечание']]},
orders:{t:'Заказ',f:[['client','Клиент *'],['contact','Контакты'],['items','Товары (по строке: название — кол-во ед.)','a'],['due','Желаемый срок','d'],['status','Статус','s',OS],['note','Примечание']]},
issues:{t:'Проблема',f:[['title','Заголовок *'],['desc','Описание'],['cat','Категория','s',IC],['place','Место'],['prio','Приоритет','s',PR],['status','Статус','s',IS],['action','Принятые меры','a'],['note','Комментарий']]},
staff:{t:'Сотрудник',f:[['name','ФИО *'],['role','Должность'],['phone','Телефон'],['start','Плановое начало','t'],['end','Плановый конец','t'],['lunch','Плановый обед, мин','n'],['note','Примечание'],['active','Статус','s',['Работает','Неактивен']]]}};
let st={tab:'home',page:'',q:'',from:iso(Date.now()-86400000*29),to:iso(Date.now()),cfg:{name:'Склад',tol:10}};
const A={};
function modal(h){const m=$('#mod');m.innerHTML='<div>'+h+'</div>';m.style.display='block'}A.close=()=>$('#mod').style.display='none';
A.form=async(s,id)=>{const e=E[s];const v=id?(await all(s)).find(x=>x.id==id):{};
modal('<h3>'+e.t+'</h3>'+e.f.map(([k,l,t,o])=>{const x=v[k]??'';return '<label>'+l+'</label>'+(t=='s'?'<select id="f_'+k+'">'+o.map(y=>'<option'+(y==x?' selected':'')+'>'+y+'</option>').join('')+'</select>':t=='a'?'<textarea rows=3 id="f_'+k+'">'+esc(x)+'</textarea>':'<input id="f_'+k+'" '+(t=='n'?'type=number step=any inputmode=decimal':t=='d'?'type=date':t=='t'?'type=time':'')+' value="'+esc(x)+'">')}).join('')+
'<button onclick="A.save(\''+s+'\',\''+(id||'')+'\')">Сохранить</button><button class=g onclick=A.close()>Отмена</button>'+(id?'<button class=r onclick="A.del(\''+s+'\',\''+id+'\')">Удалить</button>':''))};
A.save=async(s,id)=>{const e=E[s],old=id?(await all(s)).find(x=>x.id==id):null,v=old?{...old}:{id:uid(),created:Date.now()};
for(const[k,,t]of e.f){let x=$('#f_'+k).value;if(t=='n')x=x===''?null:parseFloat(x);v[k]=x}
if(!v[e.f[0][0]]){return alert('Заполните обязательное поле')}
for(const k of['boxes','perBox','sqm'])if(v[k]!=null&&v[k]<0)return alert('Значение не может быть отрицательным');
v.updated=Date.now();await put(s,v);
if(s=='products'){const ob=old?old.boxes||0:0,nb=v.boxes||0;if(!old||ob!=nb)await log(v,ob,nb,old?'Ручное изменение':'Создание');if(old&&old.loc!=v.loc)await log(v,nb,nb,'Перемещение: '+(old.loc||'—')+' → '+(v.loc||'—'))}
A.close();render()};
A.del=async(s,id)=>{if(confirm('Удалить запись? Действие необратимо.')){await del(s,id);A.close();render()}};
const log=(p,a,b,n)=>put('logs',{id:uid(),ts:Date.now(),pid:p.id,name:p.name,from:a,to:b,note:n});
A.adj=async(id,d)=>{const p=(await all('products')).find(x=>x.id==id),a=p.boxes||0,b=a+d;if(b<0)return alert('Нельзя списать больше остатка: на складе '+a+' кор.');
p.boxes=b;p.updated=Date.now();await put('products',p);await log(p,a,b,d>0?'Приход':'Списание');drawStock()};
const area=p=>p.sqm&&p.boxes!=null?p.boxes*p.sqm:null;
// ---- manager
function calc(s,now=Date.now()){const e=s.events,i=e.find(x=>x.type=='in');if(!i)return{};let l=0,ls=null;for(const x of e){if(x.type=='ls')ls=x.ts;if(x.type=='le'&&ls!=null){l+=x.ts-ls;ls=null}}
const o=e.find(x=>x.type=='out'),end=o?o.ts:now,cur=ls!=null&&!o?now-ls:0;return{inn:i.ts,out:o&&o.ts,lunch:l+cur,onL:ls!=null,work:end-i.ts-l-cur,inc:!o||ls!=null}}
const stateOf=(id,sh)=>{const o=sh.find(s=>s.staffId==id&&!s.events.some(e=>e.type=='out'));if(o){const t=o.events[o.events.length-1].type;return{sh:o,st:t=='ls'?'lunch':'work'}}
const d=sh.filter(s=>s.staffId==id&&day(s.events[0].ts)==day(Date.now())).sort((a,b)=>b.events[0].ts-a.events[0].ts)[0];return{sh:d,st:d?'done':'idle'}};
const NM={in:'Пришёл на работу',ls:'Ушёл на обед',le:'Вернулся с обеда',out:'Ушёл с работы'},OK={in:['ls','out'],le:['ls','out'],ls:['le']};
A.mark=async(sid,type)=>{const[sf,sh]=[(await all('staff')).find(x=>x.id==sid),await all('shifts')],{sh:s,st:z}=stateOf(sid,sh),now=Date.now();
if(type=='in'){if(z!='idle'&&z!='done')return alert('У сотрудника уже есть открытая смена')}else{const last=s&&s.events[s.events.length-1].type;if(!s||z=='done'||!OK[last].includes(type))return alert('Действие невозможно: '+({le:'сначала нужна отметка «Ушёл на обед»',out:'смена не начата или уже завершена',ls:'сначала нужен приход или возврат с обеда'}[type]||'нарушена последовательность'));
if(now<s.events[s.events.length-1].ts)return alert('Время устройства раньше последней отметки — возможно, изменены дата/время. Проверьте часы телефона.')}
if(!confirm(sf.name+'\n'+NM[type]+'\nВремя: '+fT(now)))return;
const ev={type,ts:now,auto:true};if(type=='in')await put('shifts',{id:uid(),staffId:sid,events:[ev]});else{s.events.push(ev);await put('shifts',s)}render()};
const parseDT=s=>{const t=new Date(String(s).trim().replace(' ','T')).getTime();return isNaN(t)?null:t};
A.fix=async(shid,i)=>{const s=(await all('shifts')).find(x=>x.id==shid),e=s.events[i],v=prompt('Новое время (ГГГГ-ММ-ДД ЧЧ:ММ)\nБыло: '+iso(e.ts)+' '+fT(e.ts),iso(e.ts)+' '+fT(e.ts));if(!v)return;const t=parseDT(v);if(!t)return alert('Неверный формат');
const r=prompt('Причина исправления (обязательно):');if(!r||!r.trim())return alert('Без причины исправление невозможно');
(e.fixes=e.fixes||[]).push({from:e.ts,to:t,reason:r.trim(),at:Date.now()});e.ts=t;e.auto=false;s.events.sort((a,b)=>a.ts-b.ts);await put('shifts',s);render()};
A.closeM=async shid=>{const s=(await all('shifts')).find(x=>x.id==shid),v=prompt('Реальное время окончания (ГГГГ-ММ-ДД ЧЧ:ММ):');if(!v)return;const t=parseDT(v);if(!t||t<s.events[s.events.length-1].ts)return alert('Время неверно или раньше последней отметки');
const r=prompt('Причина ручного закрытия (обязательно):');if(!r||!r.trim())return alert('Нужна причина');s.events.push({type:'out',ts:t,auto:false,reason:r.trim(),fixes:[{from:null,to:t,reason:r.trim(),at:Date.now()}]});await put('shifts',s);render()};
function dev(sf,c){const o=[];if(!c.inn)return o;const tol=st.cfg.tol*6e4,d=day(c.inn);if(sf&&sf.start){const[h,m]=sf.start.split(':');if(c.inn-(d+(h*60+ +m)*6e4)>tol)o.push('опоздание')}
if(sf&&sf.end&&sf.start&&c.out){const[h,m]=sf.end.split(':'),[h0,m0]=sf.start.split(':');if(sf.end>sf.start&&(d+(h*60+ +m)*6e4)-c.out>tol)o.push('ранний уход')}
if(sf&&sf.lunch&&c.lunch>(+sf.lunch+st.cfg.tol)*6e4&&!c.onL)o.push('длинный обед');return o}
// ---- views
const V={};
V.home=async()=>{const[p,t,o,i,sf,sh]=await Promise.all(['products','tasks','orders','issues','staff','shifts'].map(all)),now=Date.now();
const od=t.filter(x=>!['Выполнена','Отменена'].includes(x.status)&&x.due&&new Date(x.due+'T23:59')<now).length,ac=o.filter(x=>['Новый','На подготовке','Готов'].includes(x.status)).length,oi=i.filter(x=>['Новая','Проверяется'].includes(x.status)).length;
const act=sf.filter(x=>x.active!='Неактивен'),z=act.map(x=>stateOf(x.id,sh).st),bx=p.reduce((a,x)=>a+(x.boxes||0),0),sq=p.reduce((a,x)=>a+(area(x)||0),0);
return '<div class="c hero"><div class=m>'+new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})+'</div><div class=big>'+fT(now)+'</div></div><div class=grid><div class="c tile tb"><i>📦</i>Товаров<div class=big>'+p.length+'</div></div><div class="c tile to"><i>🧱</i>Коробок<div class=big>'+bx+'</div><div class=m>'+sq.toFixed(1)+' м² (где задана площадь)</div></div><div class="c tile '+(od?'tr':'tg')+'"><i>⏰</i>Задач просрочено<div class=big>'+od+'</div></div><div class="c tile tp"><i>🧾</i>Активных заказов<div class=big>'+ac+'</div></div></div>'+
'<div class=c>Проблемы открыто: <b>'+oi+'</b><br>Сотрудники: на работе <b>'+z.filter(x=>x=='work').length+'</b>, на обеде <b>'+z.filter(x=>x=='lunch').length+'</b>, не пришли <b>'+z.filter(x=>x=='idle').length+'</b>, ушли <b>'+z.filter(x=>x=='done').length+'</b></div><h3>Быстрые действия</h3><button onclick="A.go(\'stock\')">Найти товар</button><button onclick="A.form(\'products\')">Добавить товар</button><button onclick="A.form(\'tasks\')">Создать задачу</button><button onclick="A.form(\'orders\')">Создать заказ</button><button onclick="A.form(\'issues\')">Зафиксировать проблему</button><button onclick="A.go(\'mgr\')">Менеджер</button><button onclick="A.exp()">Резервная копия</button>'};

const im=(await all('settings')).find(x=>x.id=='imports')||{id:'imports',list:[]};if(im.list.includes(j.id)&&!confirm('Эта копия уже была восстановлена. Повторить?'))return;
if(!confirm('Все текущие данные будут ЗАМЕНЕНЫ данными из копии от '+fDT(j.at)+'. Сначала будет предложено сохранить текущую копию. Продолжить?'))return;await A.exp();if(!confirm('Копия текущих данных сохранена? Нажмите OK для восстановления.'))return;

A.csv=async()=>{const[sf,sh]=await Promise.all([all('staff'),all('shifts')]),{L}=repData(sf,sh),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const rows=[['Сотрудник','Дата','Приход','Обед ушёл','Обед вернулся','Уход','Отработано','Обед','Неполная','Исправлено']];
for(const s of L){const c=calc(s),g=t=>{const e=s.events.find(x=>x.type==t);return e?fT(e.ts):''};rows.push([(sf.find(x=>x.id==s.staffId)||{}).name,fD(s.events[0].ts),g('in'),g('ls'),g('le'),g('out'),dur(c.work),dur(c.lunch),c.inc?'да':'',s.events.some(e=>!e.auto)?'да':''])}
saveFile('artag-shifts.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv')};
const PK=[['name','Название',/назв/i],['sku','Артикул',/артик/i],['cat','Категория',/катег/i],['size','Размер',/разм/i],['sqm','м² в коробке',/м²|м2|площ/i],['perBox','Единиц в коробке',/единиц|в короб|пачк|шт/i],['unit','Ед. измерения',/изм/i],['boxes','Коробок',/^короб|кол|остат/i],['loc','Место',/мест|располож|ячей/i],['desc','Описание',/опис/i]],NUMK=['sqm','perBox','boxes'];
const EN=[['name',/^(name|title|product)$/i],['sku',/^(sku|article|code|vendor_?code)$/i],['cat',/^(cat|category|type)$/i],['size',/^size$/i],['sqm',/^(sqm|area|m2|sqm_?per_?box)$/i],['perBox',/^(per_?box|pcs|pieces|units_?per_?box|pcs_?per_?box)$/i],['unit',/^unit$/i],['boxes',/^(boxes|qty|quantity|stock|count|amount)$/i],['loc',/^(loc|location|place)$/i],['desc',/^(desc|description|note|notes)$/i]];
const km=h=>{h=String(h).trim();const e=EN.find(([,re])=>re.test(h));if(e)return e[0];const k=PK.find(([,,re])=>re.test(h));return k?k[0]:null};
function toRows(t){t=t.replace(/^\ufeff/,'');if(/^\s*[\[{]/.test(t)){const j=JSON.parse(t),a=Array.isArray(j)?j:(j.products||j.items||(j.data&&j.data.products)||[]);if(!a.length)throw 0;const ks=[...new Set(a.flatMap(o=>Object.keys(o)))];return [ks,...a.map(o=>ks.map(k=>o[k]==null?'':String(o[k])))]}return parseCSV(t)}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const l1=t.split('\n')[0],d=[';','\t',','].map(c=>[c,l1.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==d){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))R.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))R.push(r);return R}
A.pexp=async()=>{const p=await all('products'),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',n=v=>v==null?'':String(v).replace('.',','),rows=[PK.map(k=>k[1])];for(const x of p)rows.push(PK.map(([k])=>NUMK.includes(k)?n(x[k]):x[k]??''));saveFile('artag-products-'+iso(Date.now())+'.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv')};
A.pimp=async f=>{if(!f)return;let R;try{R=toRows(await f.text())}catch{return alert('Не удалось прочитать файл')}if(R.length<2)return alert('В файле нет строк с данными');
const map=R[0].map(h=>{return km(h)});if(!map.includes('name'))return alert('Не найден столбец «Название». Первая строка файла должна содержать заголовки.');
const ex=await all('products');let add=0,upd=0,bad=0;const jobs=[];
for(const r of R.slice(1)){const v={};map.forEach((k,i)=>{if(k&&r[i]!=null&&r[i].trim()!=='')v[k]=r[i].trim()});if(!v.name){bad++;continue}let ok=true;for(const k of NUMK)if(k in v){const n=parseFloat(v[k].replace(/\s/g,'').replace(',','.'));if(isNaN(n)||n<0)ok=false;else v[k]=n}if(!ok){bad++;continue}
jobs.push(v);ex.find(x=>v.sku?x.sku==v.sku:(x.name||'').toLowerCase()==v.name.toLowerCase())?upd++:add++}
if(!jobs.length)return alert('Нет корректных строк для импорта. Пропущено: '+bad);
if(!confirm('Добавить: '+add+', обновить: '+upd+(bad?', пропустить с ошибками: '+bad:'')+'.\nТовар ищется по артикулу, а если его нет — по названию. Продолжить?'))return;
for(const v of jobs){const m=ex.find(x=>v.sku?x.sku==v.sku:(x.name||'').toLowerCase()==v.name.toLowerCase()),o=m?{...m}:{id:uid(),created:Date.now()};Object.assign(o,v);o.updated=Date.now();const ob=m?m.boxes||0:0,nb=o.boxes||0;await put('products',o);if(!m||ob!=nb)await log(o,ob,nb,'Импорт');if(m)ex[ex.indexOf(m)]=o;else ex.push(o)}
alert('Импорт завершён');render()};
V.tools=async()=>'<div class=c><h3 style="margin-top:0">Калькулятор плитки</h3><div class=grid style="gap:10px"><div><label>Длина</label><input id=k1 type=number step=any inputmode=decimal placeholder="600"></div><div><label>Ширина</label><input id=k2 type=number step=any inputmode=decimal placeholder="1200"></div></div><label>Размер в</label><select id=ku><option value=1000>миллиметрах</option><option value=100>сантиметрах</option></select><label>Штук в пачке</label><input id=k3 type=number inputmode=numeric><label>Нужно клиенту, м²</label><input id=k4 type=number step=any inputmode=decimal><button onclick="A.calc()">Рассчитать</button><div id=kr></div></div>';
A.calc=()=>{const g=i=>parseFloat($('#'+i).value.replace(',','.')),L=g('k1'),W=g('k2'),P=g('k3'),N=g('k4'),u=+$('#ku').value,miss=[[L,'длину'],[W,'ширину'],[P,'штук в пачке'],[N,'сколько м² нужно']].filter(x=>!(x[0]>0)).map(x=>x[1]);
if(miss.length)return $('#kr').innerHTML='<p class=m>Не хватает данных: '+miss.join(', ')+'</p>';
const a=L/u*(W/u),pk=a*P,n=Math.ceil(N/pk-1e-9),tot=n*pk,w=n%10==1&&n%100!=11?'пачка':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'пачки':'пачек';
$('#kr').innerHTML='<div class="c tile tb" style="margin-top:12px"><div class=m>Нужно взять</div><div class=big>'+n+' '+w+'</div><div class=m>'+n*P+' шт · '+tot.toFixed(2)+' м²</div></div><div class=m>Площадь одной плитки: '+a.toFixed(4)+' м²<br>В одной пачке: '+pk.toFixed(3)+' м²<br>Минимум плиток впритык: '+Math.ceil(N/a-1e-9)+' шт<br>Запас после округления: '+(tot-N).toFixed(2)+' м²</div>'};
