<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ARTAG"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="manifest" href="manifest.json"><title>ARTAG</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,Helvetica,sans-serif;background:#f2f2f2;color:#111;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:#000;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;letter-spacing:2px;position:sticky;top:0;z-index:5}
header small{font-weight:400;letter-spacing:0;color:#aaa;margin-left:8px}
main{padding:12px}.c{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:14px 0 8px;font-size:15px;text-transform:uppercase;color:#555}
button{font:inherit;border:0;border-radius:10px;background:#000;color:#fff;padding:12px 14px;margin:3px 3px 3px 0}
button.g{background:#e3e3e3;color:#000}button.r{background:#c62828}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #bbb;border-radius:8px;margin:3px 0 8px;background:#fff}
label{font-size:13px;color:#555}nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav div{flex:1;text-align:center;color:#888;padding:14px 0;font-size:13px}nav .on{color:#fff;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:#666;font-size:13px}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;background:#ddd;margin-right:4px}.red{background:#ffcdd2}.grn{background:#c8e6c9}.yel{background:#fff3b0}
#mod{position:fixed;inset:0;background:#000a;display:none;z-index:9;overflow:auto;padding:16px}#mod>div{background:#fff;border-radius:12px;padding:16px;max-width:520px;margin:auto}
.big{font-size:26px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}table{width:100%;font-size:13px;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:4px;text-align:left}
</style></head><body>
<header>ARTAG<small id="wn"></small></header><main id="main"></main><div id="mod"></div>
<nav id="nav"></nav>
<script>
const S=['products','logs','tasks','orders','issues','staff','shifts','settings'];let db;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fT=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),fD=t=>new Date(t).toLocaleDateString('ru'),fDT=t=>fD(t)+' '+fT(t);
const dur=ms=>{const m=Math.round(Math.max(0,ms)/6e4);return Math.floor(m/60)+' ч '+m%60+' мин'};
const day=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const iso=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('artag',1);q.onupgradeneeded=()=>S.forEach(s=>q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>{db=q.result;r()};q.onerror=j});
const tx=(s,m,f)=>new Promise((r,j)=>{const t=db.transaction(s,m);const o=f(t.objectStore(s));t.oncomplete=()=>r(o&&o.result);t.onerror=()=>j(t.error)});
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id)),clr=s=>tx(s,'readwrite',o=>o.clear());
const PR=['Низкий','Средний','Высокий'],TS=['Новая','В работе','Ожидает','Выполнена','Отменена'],OS=['Новый','На подготовке','Готов','Выдан','Отменён'],IS=['Новая','Проверяется','Решена','Закрыта'],IC=['Недостача','Повреждение товара','Ошибка размещения','Несоответствие остатков','Оборудование','Организация работы','Прочее'];
const E={products:{t:'Товар',f:[['name','Название *'],['sku','Артикул'],['cat','Категория'],['size','Размер'],['boxes','Коробок','n'],['perBox','Единиц в коробке','n'],['sqm','м² в одной коробке','n'],['unit','Ед. измерения'],['loc','Место (зона/ряд/ячейка)'],['desc','Описание']]},
tasks:{t:'Задача',f:[['title','Название *'],['desc','Описание'],['due','Срок','d'],['prio','Приоритет','s',PR],['status','Статус','s',TS],['who','Ответственный'],['note','Примечание']]},
orders:{t:'Заказ',f:[['client','Клиент *'],['contact','Контакты'],['items','Товары (по строке: название — кол-во ед.)','a'],['due','Желаемый срок','d'],['status','Статус','s',OS],['note','Примечание']]},
issues:{t:'Проблема',f:[['title','Заголовок *'],['desc','Описание'],['cat','Категория','s',IC],['place','Место'],['prio','Приоритет','s',PR],['status','Статус','s',IS],['action','Принятые меры','a'],['note','Комментарий']]},
staff:{t:'Сотрудник',f:[['name','ФИО *'],['role','Должность'],['phone','Телефон'],['start','Плановое начало','t'],['end','Плановый конец','t'],['lunch','Плановый обед, мин','n'],['note','Примечание'],['active','Статус','s',['Работает','Неактивен']]]}};
let st={tab:'home',page:'',q:'',from:iso(Date.now()-86400000*29),to:iso(Date.now()),cfg:{name:'Склад',tol:10}};
const A={};
function modal(h){const m=$('#mod');m.innerHTML='<div>'+h+'</div>';m.style.display='block'}A.close=()=>$('#mod').style.display='none';
A.form=async(s,id)=>{const e=E[s];const v=id?(await all(s)).find(x=>x.id==id):{};
modal('<h3>'+e.t+'</h3>'+e.f.map(([k,l,t,o])=>{const x=v[k]??'';return '<label>'+l+'</label>'+(t=='s'?'<select id="f_'+k+'">'+o.map(y=>'<option'+(y==x?' selected':'')+'>'+y+'</option>').join('')+'</select>':t=='a'?'<textarea rows=3 id="f_'+k+'">'+esc(x)+'</textarea>':'<input id="f_'+k+'" '+(t=='n'?'type=number step=any inputmode=decimal':t=='d'?'type=date':t=='t'?'type=time':'')+' value="'+esc(x)+'">')}).join('')+
'<button onclick="A.save(\''+s+'\',\''+(id||'')+'\')">Сохранить</button><button class=g onclick=A.close()>Отмена</button>'+(id?'<button class=r onclick="A.del(\''+s+'\',\''+id+'\')">Удалить</button>':''))};
A.save=async(s,id)=>{const e=E[s],old=id?(await all(s)).find(x=>x.id==id):null,v=old?{...old}:{id:uid(),created:Date.now()};
for(const[k,,t]of e.f){let x=$('#f_'+k).value;if(t=='n')x=x===''?null:parseFloat(x);v[k]=x}
if(!v[e.f[0][0]]){return alert('Заполните обязательное поле')}
for(const k of['boxes','perBox','sqm'])if(v[k]!=null&&v[k]<0)return alert('Значение не может быть отрицательным');
v.updated=Date.now();await put(s,v);
if(s=='products'){const ob=old?old.boxes||0:0,nb=v.boxes||0;if(!old||ob!=nb)await log(v,ob,nb,old?'Ручное изменение':'Создание');if(old&&old.loc!=v.loc)await log(v,nb,nb,'Перемещение: '+(old.loc||'—')+' → '+(v.loc||'—'))}
A.close();render()};
A.del=async(s,id)=>{if(confirm('Удалить запись? Действие необратимо.')){await del(s,id);A.close();render()}};
const log=(p,a,b,n)=>put('logs',{id:uid(),ts:Date.now(),pid:p.id,name:p.name,from:a,to:b,note:n});
A.adj=async(id,d)=>{const p=(await all('products')).find(x=>x.id==id),a=p.boxes||0,b=a+d;if(b<0)return alert('Нельзя списать больше остатка: на складе '+a+' кор.');
p.boxes=b;p.updated=Date.now();await put('products',p);await log(p,a,b,d>0?'Приход':'Списание');drawStock()};
const area=p=>p.sqm&&p.boxes!=null?p.boxes*p.sqm:null;
// ---- manager
function calc(s,now=Date.now()){const e=s.events,i=e.find(x=>x.type=='in');if(!i)return{};let l=0,ls=null;for(const x of e){if(x.type=='ls')ls=x.ts;if(x.type=='le'&&ls!=null){l+=x.ts-ls;ls=null}}
const o=e.find(x=>x.type=='out'),end=o?o.ts:now,cur=ls!=null&&!o?now-ls:0;return{inn:i.ts,out:o&&o.ts,lunch:l+cur,onL:ls!=null,work:end-i.ts-l-cur,inc:!o||ls!=null}}
const stateOf=(id,sh)=>{const o=sh.find(s=>s.staffId==id&&!s.events.some(e=>e.type=='out'));if(o){const t=o.events[o.events.length-1].type;return{sh:o,st:t=='ls'?'lunch':'work'}}
const d=sh.filter(s=>s.staffId==id&&day(s.events[0].ts)==day(Date.now())).sort((a,b)=>b.events[0].ts-a.events[0].ts)[0];return{sh:d,st:d?'done':'idle'}};
const NM={in:'Пришёл на работу',ls:'Ушёл на обед',le:'Вернулся с обеда',out:'Ушёл с работы'},OK={in:['ls','out'],le:['ls','out'],ls:['le']};
A.mark=async(sid,type)=>{const[sf,sh]=[(await all('staff')).find(x=>x.id==sid),await all('shifts')],{sh:s,st:z}=stateOf(sid,sh),now=Date.now();
if(type=='in'){if(z!='idle'&&z!='done')return alert('У сотрудника уже есть открытая смена')}else{const last=s&&s.events[s.events.length-1].type;if(!s||z=='done'||!OK[last].includes(type))return alert('Действие невозможно: '+({le:'сначала нужна отметка «Ушёл на обед»',out:'смена не начата или уже завершена',ls:'сначала нужен приход или возврат с обеда'}[type]||'нарушена последовательность'));
if(now<s.events[s.events.length-1].ts)return alert('Время устройства раньше последней отметки — возможно, изменены дата/время. Проверьте часы телефона.')}
if(!confirm(sf.name+'\n'+NM[type]+'\nВремя: '+fT(now)))return;
const ev={type,ts:now,auto:true};if(type=='in')await put('shifts',{id:uid(),staffId:sid,events:[ev]});else{s.events.push(ev);await put('shifts',s)}render()};
const parseDT=s=>{const t=new Date(String(s).trim().replace(' ','T')).getTime();return isNaN(t)?null:t};
A.fix=async(shid,i)=>{const s=(await all('shifts')).find(x=>x.id==shid),e=s.events[i],v=prompt('Новое время (ГГГГ-ММ-ДД ЧЧ:ММ)\nБыло: '+iso(e.ts)+' '+fT(e.ts),iso(e.ts)+' '+fT(e.ts));if(!v)return;const t=parseDT(v);if(!t)return alert('Неверный формат');
const r=prompt('Причина исправления (обязательно):');if(!r||!r.trim())return alert('Без причины исправление невозможно');
(e.fixes=e.fixes||[]).push({from:e.ts,to:t,reason:r.trim(),at:Date.now()});e.ts=t;e.auto=false;s.events.sort((a,b)=>a.ts-b.ts);await put('shifts',s);render()};
A.closeM=async shid=>{const s=(await all('shifts')).find(x=>x.id==shid),v=prompt('Реальное время окончания (ГГГГ-ММ-ДД ЧЧ:ММ):');if(!v)return;const t=parseDT(v);if(!t||t<s.events[s.events.length-1].ts)return alert('Время неверно или раньше последней отметки');
const r=prompt('Причина ручного закрытия (обязательно):');if(!r||!r.trim())return alert('Нужна причина');s.events.push({type:'out',ts:t,auto:false,reason:r.trim(),fixes:[{from:null,to:t,reason:r.trim(),at:Date.now()}]});await put('shifts',s);render()};
function dev(sf,c){const o=[];if(!c.inn)return o;const tol=st.cfg.tol*6e4,d=day(c.inn);if(sf&&sf.start){const[h,m]=sf.start.split(':');if(c.inn-(d+(h*60+ +m)*6e4)>tol)o.push('опоздание')}
if(sf&&sf.end&&sf.start&&c.out){const[h,m]=sf.end.split(':'),[h0,m0]=sf.start.split(':');if(sf.end>sf.start&&(d+(h*60+ +m)*6e4)-c.out>tol)o.push('ранний уход')}
if(sf&&sf.lunch&&c.lunch>(+sf.lunch+st.cfg.tol)*6e4&&!c.onL)o.push('длинный обед');return o}
// ---- views
const V={};
V.home=async()=>{const[p,t,o,i,sf,sh]=await Promise.all(['products','tasks','orders','issues','staff','shifts'].map(all)),now=Date.now();
const od=t.filter(x=>!['Выполнена','Отменена'].includes(x.status)&&x.due&&new Date(x.due+'T23:59')<now).length,ac=o.filter(x=>['Новый','На подготовке','Готов'].includes(x.status)).length,oi=i.filter(x=>['Новая','Проверяется'].includes(x.status)).length;
const act=sf.filter(x=>x.active!='Неактивен'),z=act.map(x=>stateOf(x.id,sh).st),bx=p.reduce((a,x)=>a+(x.boxes||0),0),sq=p.reduce((a,x)=>a+(area(x)||0),0);
return '<div class=c><div class=m>'+new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})+'</div><div class=big>'+fT(now)+'</div></div><div class=grid><div class=c>Товаров<div class=big>'+p.length+'</div></div><div class=c>Коробок<div class=big>'+bx+'</div><div class=m>'+sq.toFixed(1)+' м² (где задана площадь)</div></div><div class=c>Задач просрочено<div class=big style="color:'+(od?'#c62828':'#111')+'">'+od+'</div></div><div class=c>Активных заказов<div class=big>'+ac+'</div></div></div>'+
'<div class=c>Проблемы открыто: <b>'+oi+'</b><br>Сотрудники: на работе <b>'+z.filter(x=>x=='work').length+'</b>, на обеде <b>'+z.filter(x=>x=='lunch').length+'</b>, не пришли <b>'+z.filter(x=>x=='idle').length+'</b>, ушли <b>'+z.filter(x=>x=='done').length+'</b></div><h3>Быстрые действия</h3><button onclick="A.go(\'stock\')">Найти товар</button><button onclick="A.form(\'products\')">Добавить товар</button><button onclick="A.form(\'tasks\')">Создать задачу</button><button onclick="A.form(\'orders\')">Создать заказ</button><button onclick="A.form(\'issues\')">Зафиксировать проблему</button><button onclick="A.go(\'mgr\')">Менеджер</button><button onclick="A.exp()">Резервная копия</button>'};
function listHtml(s,items,f){return items.length?items.map(f).join(''):'<div class="c m">Записей пока нет</div>'}
const card=(s,x,t,m,b)=>'<div class=c onclick="A.form(\''+s+'\',\''+x.id+'\')"><div class=row><b>'+esc(t)+'</b><span>'+(b||'')+'</span></div><div class=m>'+m+'</div></div>';
async function stockList(){const q=st.q.toLowerCase(),p=(await all('products')).filter(x=>!q||[x.name,x.sku,x.size,x.cat,x.loc].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru'));
return p.length?p.map(x=>{const a=area(x);return '<div class=c><div onclick="A.form(\'products\',\''+x.id+'\')"><b>'+esc(x.name)+'</b> <span class=m>'+esc(x.sku)+'</span><div class=m>'+[x.cat,x.size,x.loc].filter(Boolean).map(esc).join(' · ')+'</div><div>'+(x.boxes||0)+' кор.'+(a!=null?' = '+a.toFixed(2)+' м²':'')+(x.perBox?' · '+(x.boxes||0)*x.perBox+' '+esc(x.unit||'ед.'):'')+'</div></div><button class=g onclick="A.adj(\''+x.id+'\',-1)">− 1</button><button onclick="A.adj(\''+x.id+'\',1)">+ 1</button></div>'}).join(''):'<div class="c m">Ничего не найдено. Нажмите «Добавить».</div>'}
async function drawStock(){$('#sl').innerHTML=await stockList()}
V.stock=async()=>'<input placeholder="Поиск: название, артикул, размер, место" value="'+esc(st.q)+'" oninput="st.q=this.value;drawStock()"><button onclick="A.form(\'products\')">+ Добавить товар</button><div id=sl>'+await stockList()+'</div>';
V.tasks=async()=>{const t=(await all('tasks')).sort((a,b)=>(TS.indexOf(a.status)>2)-(TS.indexOf(b.status)>2)||PR.indexOf(b.prio)-PR.indexOf(a.prio)||(a.due||'9').localeCompare(b.due||'9'));
return '<button onclick="A.form(\'tasks\')">+ Задача</button>'+listHtml('tasks',t,x=>{const over=!['Выполнена','Отменена'].includes(x.status)&&x.due&&new Date(x.due+'T23:59')<Date.now();return card('tasks',x,x.title,[x.status,x.prio,x.due?'до '+x.due:'',x.who].filter(Boolean).join(' · '),over?'<span class="b red">просрочена</span>':'')})};
V.orders=async()=>'<button onclick="A.form(\'orders\')">+ Заказ</button>'+listHtml('orders',(await all('orders')).sort((a,b)=>b.created-a.created),x=>card('orders',x,'№'+x.id.slice(-4).toUpperCase()+' '+x.client,fD(x.created)+' · '+x.status+(x.due?' · к '+x.due:'')+'<br>'+esc(x.items||''),''));
V.issues=async()=>'<button onclick="A.form(\'issues\')">+ Проблема</button>'+listHtml('issues',(await all('issues')).sort((a,b)=>b.created-a.created),x=>card('issues',x,x.title,fD(x.created)+' · '+x.cat+' · '+x.status+' · '+x.prio+(x.action?'<br>Меры: '+esc(x.action):''),''));
V.mgr=async()=>{const[sf,sh]=await Promise.all([all('staff'),all('shifts')]);const act=sf.filter(x=>x.active!='Неактивен');
return '<button onclick="A.form(\'staff\')">+ Сотрудник</button><button class=g onclick="A.go(\'rep\')">Отчёты и журнал</button>'+(act.length?act.map(x=>{const{sh:s,st:z}=stateOf(x.id,sh),c=s?calc(s):{},stale=s&&z!='done'&&day(c.inn)<day(Date.now());
const lab=stale?'Требуется проверка':{idle:'Ещё не пришёл',work:'На работе',lunch:'На обеде',done:'Смена завершена'}[z];const ev=s?s.events.map(e=>NM[e.type].split(' ')[0]+' '+fT(e.ts)).join(' · '):'';const d=dev(x,c);
const bt=t=>'<button onclick="A.mark(\''+x.id+'\',\''+t+'\')"'+(t=='out'?' class=g':'')+'>'+NM[t]+'</button>';
return '<div class=c><div class=row><b onclick="A.form(\'staff\',\''+x.id+'\')">'+esc(x.name)+'</b><span class="b '+(stale?'yel':z=='work'?'grn':'')+'">'+lab+'</span></div><div class=m>'+ev+'</div>'+(c.inn?'<div>Отработано: <b>'+dur(c.work)+'</b>'+(c.lunch?' · обед '+dur(c.lunch):'')+(c.inc?' <span class="b yel">предварительно</span>':'')+'</div>':'')+(d.length?'<div>'+d.map(y=>'<span class="b yel">'+y+'</span>').join('')+'</div>':'')+
'<div>'+({idle:bt('in'),work:bt('ls')+bt('out'),lunch:bt('le'),done:'<span class=m>Рабочий день закрыт</span>'}[z])+'</div></div>'}).join(''):'<div class="c m">Добавьте сотрудников, чтобы вести учёт времени.</div>')};
function repData(sf,sh){const f=new Date(st.from+'T00:00').getTime(),t=new Date(st.to+'T23:59:59').getTime(),L=sh.filter(s=>s.events[0].ts>=f&&s.events[0].ts<=t).sort((a,b)=>b.events[0].ts-a.events[0].ts);
const R=sf.map(x=>{const l=L.filter(s=>s.staffId==x.id),cs=l.map(s=>calc(s)),w=cs.filter(c=>c.work!=null);const ds=l.map((s,i)=>dev(x,cs[i]));
return{x,n:l.length,work:w.reduce((a,c)=>a+c.work,0),lunch:w.reduce((a,c)=>a+c.lunch,0),late:ds.filter(d=>d.includes('опоздание')).length,early:ds.filter(d=>d.includes('ранний уход')).length,inc:cs.filter(c=>c.inc).length}}).filter(r=>r.n);return{L,R}}
V.rep=async()=>{const[sf,sh]=await Promise.all([all('staff'),all('shifts')]),{L,R}=repData(sf,sh),nm=id=>(sf.find(x=>x.id==id)||{}).name;
return '<div class=c><label>С</label><input type=date value='+st.from+' onchange="st.from=this.value;render()"><label>По</label><input type=date value='+st.to+' onchange="st.to=this.value;render()"><button onclick="A.csv()">Экспорт CSV</button></div>'+
'<h3>Сводка'+(R.some(r=>r.inc)?' (есть неполные смены — не окончательно)':'')+'</h3><div class=c style="overflow:auto"><table><tr><th>Сотр.<th>Смен<th>Часы<th>Ср.<th>Обед<th>Опозд.<th>Ран.<th>Неполн.</tr>'+R.map(r=>'<tr><td>'+esc(r.x.name)+'<td>'+r.n+'<td>'+dur(r.work)+'<td>'+dur(r.work/r.n)+'<td>'+dur(r.lunch)+'<td>'+r.late+'<td>'+r.early+'<td>'+r.inc).join('')+'</table></div>'+
'<h3>Журнал смен</h3>'+listHtml('',L,s=>{const c=calc(s);return '<div class=c><b>'+esc(nm(s.staffId))+'</b> <span class=m>'+fD(s.events[0].ts)+'</span><div>Отработано: '+dur(c.work)+(c.inc?' <span class="b yel">неполная</span>':'')+'</div>'+s.events.map((e,i)=>'<div class=m onclick="A.fix(\''+s.id+'\','+i+')">'+NM[e.type]+': '+fDT(e.ts)+(e.auto?'':' <span class="b yel">исправлено</span>')+(e.fixes?e.fixes.map(f=>'<br>&nbsp;&nbsp;было '+(f.from?fDT(f.from):'—')+' ('+esc(f.reason)+', '+fD(f.at)+')').join(''):'')+' ✎</div>').join('')+(s.events.some(e=>e.type=='out')?'':'<button class=g onclick="A.closeM(\''+s.id+'\')">Закрыть вручную</button>')+'</div>'})};
const BM=[['orders','Заказы'],['issues','Проблемы'],['tools','Калькуляторы'],['rep','Отчёты'],['logs','Журнал остатков'],['backup','Резервная копия'],['set','Настройки']];
V.more=async()=>BM.map(([k,l])=>'<div class="c row" onclick="A.go(\''+k+'\')"><b>'+l+'</b><span>›</span></div>').join('');
V.tools=async()=>'<div class=c><h3>Площадь → коробки</h3><label>Нужно м²</label><input id=t1 type=number step=any inputmode=decimal><label>м² в коробке</label><input id=t2 type=number step=any inputmode=decimal><button onclick="A.t1()">Рассчитать</button><div id=r1 class=big></div></div><div class=c><h3>Коробки → площадь</h3><label>Коробок</label><input id=t3 type=number inputmode=decimal><label>м² в коробке</label><input id=t4 type=number step=any inputmode=decimal><button onclick="A.t2()">Рассчитать</button><div id=r2 class=big></div></div><div class=c><h3>Размеры</h3><label>Длина × ширина, мм</label><input id=t5 placeholder="600x1200"><button onclick="A.t3()">В м²</button><div id=r3 class=big></div></div>';
A.t1=()=>{const a=+$('#t1').value,b=+$('#t2').value;$('#r1').textContent=a&&b?Math.ceil(a/b)+' кор. ('+(Math.ceil(a/b)*b).toFixed(2)+' м²)':'Не хватает: '+(a?'':'площади ')+(b?'':'м² в коробке')};
A.t2=()=>{const a=+$('#t3').value,b=+$('#t4').value;$('#r2').textContent=a&&b?(a*b).toFixed(2)+' м²':'Не хватает данных'};
A.t3=()=>{const m=$('#t5').value.toLowerCase().replace(',','.').match(/([\d.]+)\s*[x×х*]\s*([\d.]+)/);$('#r3').textContent=m?(m[1]*m[2]/1e6).toFixed(4)+' м²':'Формат: 600x1200'};
V.logs=async()=>listHtml('',(await all('logs')).sort((a,b)=>b.ts-a.ts).slice(0,200),x=>'<div class=c><b>'+esc(x.name)+'</b><div class=m>'+fDT(x.ts)+' · '+esc(x.note)+'</div>'+x.from+' → '+x.to+'</div>');
V.set=async()=>'<div class=c><label>Название склада</label><input id=s1 value="'+esc(st.cfg.name)+'"><label>Допустимое отклонение, мин</label><input id=s2 type=number value='+st.cfg.tol+'><button onclick="A.setSave()">Сохранить</button><p class=m>Версия приложения 1.0, база v1. Опоздания пересчитываются по текущему допуску; исходные отметки не меняются.</p></div>';
A.setSave=async()=>{st.cfg={id:'cfg',name:$('#s1').value,tol:+$('#s2').value||0};await put('settings',st.cfg);$('#wn').textContent=st.cfg.name;alert('Сохранено')};
V.backup=async()=>'<div class=c><button onclick="A.exp()">Создать копию (JSON)</button><p class=m>Файл содержит все данные: товары, журнал, задачи, заказы, проблемы, сотрудников, смены и исправления.</p><label>Восстановить из файла</label><input type=file id=imp accept=".json" onchange="A.imp(this.files[0])"></div>';
function saveFile(n,txt,type){const f=new File([txt],n,{type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;a.click()}}
A.exp=async()=>{const d={};for(const s of S)d[s]=(await all(s)).filter(x=>x.id!='imports');saveFile('artag-backup-'+iso(Date.now())+'.json',JSON.stringify({app:'ARTAG',v:1,id:uid(),at:Date.now(),data:d}),'application/json')};
A.imp=async f=>{if(!f)return;let j;try{j=JSON.parse(await f.text());if(j.app!='ARTAG'||!j.data||!S.every(s=>Array.isArray(j.data[s])))throw 0}catch{return alert('Файл повреждён или не является копией ARTAG')}
const im=(await all('settings')).find(x=>x.id=='imports')||{id:'imports',list:[]};if(im.list.includes(j.id)&&!confirm('Эта копия уже была восстановлена. Повторить?'))return;
if(!confirm('Все текущие данные будут ЗАМЕНЕНЫ данными из копии от '+fDT(j.at)+'. Сначала будет предложено сохранить текущую копию. Продолжить?'))return;await A.exp();if(!confirm('Копия текущих данных сохранена? Нажмите OK для восстановления.'))return;
for(const s of S){await clr(s);for(const x of j.data[s])await put(s,x)}im.list.push(j.id);await put('settings',im);await init();alert('Данные восстановлены')};
A.csv=async()=>{const[sf,sh]=await Promise.all([all('staff'),all('shifts')]),{L}=repData(sf,sh),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const rows=[['Сотрудник','Дата','Приход','Обед ушёл','Обед вернулся','Уход','Отработано','Обед','Неполная','Исправлено']];
for(const s of L){const c=calc(s),g=t=>{const e=s.events.find(x=>x.type==t);return e?fT(e.ts):''};rows.push([(sf.find(x=>x.id==s.staffId)||{}).name,fD(s.events[0].ts),g('in'),g('ls'),g('le'),g('out'),dur(c.work),dur(c.lunch),c.inc?'да':'',s.events.some(e=>!e.auto)?'да':''])}
saveFile('artag-shifts.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv')};
const TABS=[['home','Главная'],['stock','Склад'],['tasks','Задачи'],['mgr','Менеджер'],['more','Ещё']];
A.go=k=>{if(TABS.some(t=>t[0]==k)){st.tab=k;st.page=''}else st.page=k;render();scrollTo(0,0)};
async function render(){const v=st.page||st.tab;const back=st.page&&st.page!='more'&&!['rep'].includes(st.page)||st.page=='rep';
$('#main').innerHTML=(st.page?'<button class=g onclick="A.go(\''+(['orders','issues','tools','rep','logs','backup','set'].includes(st.page)?'more':st.tab)+'\')">‹ Назад</button>':'')+await V[v]();
$('#nav').innerHTML=TABS.map(([k,l])=>'<div class="'+((st.page?(['orders','issues','tools','rep','logs','backup','set'].includes(st.page)?'more':st.tab):st.tab)==k?'on':'')+'" onclick="A.go(\''+k+'\')">'+l+'</div>').join('')}
async function init(){await open();const c=(await all('settings')).find(x=>x.id=='cfg');if(c)st.cfg=c;$('#wn').textContent=st.cfg.name;render()}
init();setInterval(()=>{if(!$('#mod').style.display||$('#mod').style.display=='none')if(['home','mgr'].includes(st.page||st.tab))render()},60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
